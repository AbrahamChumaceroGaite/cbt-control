events {
  worker_connections 1024;
}

http {
  gzip       on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  server_tokens off;

  # Large file uploads (game ROMs, BIOS, cover images)
  client_max_body_size 0;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream nestjs_api {
    server api:4001;
  }

  upstream games_api {
    server api-games:4003;
  }

  upstream nextjs_web {
    server web:3001;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";
    # EmulatorJS loads scripts, styles, workers, and WASM from its CDN.
    # Game files (ROM, BIOS, cover) are fetched directly from MinIO via presigned URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.emulatorjs.org; style-src 'self' 'unsafe-inline' https://cdn.emulatorjs.org; img-src 'self' data: blob: https://cdn.emulatorjs.org; connect-src 'self' wss: ws: https://cdn.emulatorjs.org http: https:; media-src 'self' blob: https://cdn.emulatorjs.org; worker-src 'self' blob: https://cdn.emulatorjs.org; font-src 'self' https://cdn.emulatorjs.org;";

    # ── WebSocket — direct to Core API, bypasses Next.js ─────────────────────
    location /ws {
      proxy_pass         http://nestjs_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade         $http_upgrade;
      proxy_set_header   Connection      "upgrade";
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Cookie          $http_cookie;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── Core NestJS API ───────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://nestjs_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Cookie            $http_cookie;
      proxy_read_timeout 60s;
    }

    # ── Games API — rewrites /api-games/x → /api/x on api-games:4003 ─────────
    location /api-games/ {
      proxy_pass         http://games_api/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Cookie            $http_cookie;
      proxy_read_timeout 60s;
    }

    # ── Next.js static assets ─────────────────────────────────────────────────
    location /_next/static/ {
      proxy_pass       http://nextjs_web;
      proxy_set_header Host $host;
      expires          1y;
      add_header       Cache-Control "public, immutable";
    }

    # ── Next.js (everything else) ─────────────────────────────────────────────
    location / {
      proxy_pass         http://nextjs_web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Cookie            $http_cookie;
      proxy_read_timeout 60s;
    }
  }
}
