<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #error {
      display: none; position: fixed; inset: 0;
      align-items: center; justify-content: center;
      background: #000; color: #ef4444;
      font-family: monospace; font-size: 14px; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="error"></div>

  <script>
    (function () {
      var params  = new URLSearchParams(window.location.search)
      var core    = params.get('core')
      var gameUrl = params.get('gameUrl')
      var biosUrl = params.get('biosUrl')

      if (!core || !gameUrl) {
        var el = document.getElementById('error')
        el.style.display = 'flex'
        el.textContent   = 'Missing emulator parameters.\nExpected: ?core=psx&gameUrl=<url>'
        return
      }

      // EmulatorJS global config — must be set before loader.js executes
      EJS_player        = '#game'
      EJS_core          = core
      EJS_gameUrl       = gameUrl
      EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/'
      EJS_startOnLoaded = true
      EJS_defaultOptions = { 'save-state-location': 'browser' }

      if (biosUrl) EJS_biosUrl = biosUrl

      // Notify parent frame when emulator boots
      EJS_onGameStart = function () {
        window.parent.postMessage({ type: 'SESSION_START' }, '*')
      }

      // Load the EmulatorJS runtime
      var script   = document.createElement('script')
      script.src   = 'https://cdn.emulatorjs.org/stable/data/loader.js'
      script.onerror = function () {
        var el = document.getElementById('error')
        el.style.display = 'flex'
        el.textContent   = 'Failed to load EmulatorJS.\nCheck your internet connection.'
      }
      document.body.appendChild(script)
    })()
  </script>
</body>
</html>
