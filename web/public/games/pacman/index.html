<script>
// ── postMessage ──────────────────────────────────────────────────────────────
const PM={
  start(l){window.parent.postMessage({type:'SESSION_START',gameSlug:'pacman'},'*')},
  levelComplete(l,s,t){window.parent.postMessage({type:'LEVEL_COMPLETE',level:l,score:s,time:t},'*')},
  gameOver(l,s){window.parent.postMessage({type:'GAME_OVER',level:l,score:s},'*')},
  requestContinue(){window.parent.postMessage({type:'CONTINUE_REQUESTED'},'*')},
}
window.addEventListener('message',e=>{
  if(e.data?.type==='CONTINUE_GRANTED') G.doContinue()
  if(e.data?.type==='CONTINUE_DENIED')  showOver('GAME OVER',`Score: ${G.score}`,false)
  if(e.data?.type==='START_LEVEL')      launchLevel(e.data.level||1)
})

// ── Audio (Web Audio API — no external files) ────────────────────────────────
const Sfx={
  _ctx:null,
  _get(){
    if(!this._ctx) this._ctx=new(window.AudioContext||window.webkitAudioContext)()
    return this._ctx
  },
  tone(freq,dur,vol=0.12,type='square',delay=0){
    try{
      const c=this._get(),o=c.createOscillator(),g=c.createGain()
      o.connect(g);g.connect(c.destination)
      o.type=type;o.frequency.value=freq
      const t=c.currentTime+delay
      g.gain.setValueAtTime(vol,t)
      g.gain.exponentialRampToValueAtTime(0.001,t+dur)
      o.start(t);o.stop(t+dur)
    }catch(e){}
  },
  eat(){
    // alternate between two pitches for waka-waka feel
    this._wakaFlip=!this._wakaFlip
    this.tone(this._wakaFlip?523:466,0.06,0.08)
  },
  power(){this.tone(180,0.35,0.18,'sawtooth')},
  eatGhost(){
    [500,650,800,1000].forEach((f,i)=>this.tone(f,0.09,0.15,'square',i*0.07))
  },
  death(){
    const n=[494,466,440,415,392,370,349,330,311,294]
    n.forEach((f,i)=>this.tone(f,0.14,0.14,'sawtooth',i*0.07))
  },
  win(){
    [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.18,0.15,'square',i*0.13))
  },
  _wakaFlip:false,
}

// ── Save / load (localStorage) ────────────────────────────────────────────────
const Save={
  KEY:'pacman_progress_v1',
  get(){try{const d=localStorage.getItem(this.KEY);return d?JSON.parse(d):null}catch{return null}},
  set(level,score,lives){try{localStorage.setItem(this.KEY,JSON.stringify({level,score,lives}))}catch{}},
  clear(){try{localStorage.removeItem(this.KEY)}catch{}},
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const TILE=20,COLS=21,ROWS=21,CW=COLS*TILE,CH=ROWS*TILE
const canvas=document.getElementById('c')
const ctx=canvas.getContext('2d')
canvas.width=CW;canvas.height=CH

function resize(){
  const s=Math.min(window.innerWidth/CW,(window.innerHeight-36)/CH)
  canvas.style.width=(CW*s)+'px';canvas.style.height=(CH*s)+'px'
  canvas.style.marginTop='36px'
}
resize();window.addEventListener('resize',resize)

// ── Game object ───────────────────────────────────────────────────────────────
const G={
  level:1,score:0,lives:3,
  map:null,pellets:0,
  cfg:null,meta:null,
  startTime:0,state:'idle',raf:null,
  frame:0,

  init(level){
    const cfg=LCFG[Math.min(level,MAX_LVL)]||LCFG[MAX_LVL]
    const mazeKey=mazeForLevel(level)
    const meta=MAZE_META[mazeKey]
    this.level=level;this.cfg=cfg;this.meta=meta
    this.wallColor=wallColorForLevel(level)
    this.map=cloneMaze(MAZES[mazeKey])
    this.pellets=0
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
      if(this.map[r][c]===2||this.map[r][c]===3) this.pellets++
    this.frame=0
    Pac.reset(meta.pCol,meta.pRow)
    Ghosts.init(cfg,meta)
    Fruit.reset(cfg.fruit)
    this.startTime=Date.now()
    this.state='playing'
    this.raf=requestAnimationFrame(loop)
  },

  doContinue(){
    if(this.lives<=0)return
    Pac.reset(this.meta.pCol,this.meta.pRow)
    Ghosts.scatter()
    this.state='playing'
    this.raf=requestAnimationFrame(loop)
  },
}

// ── Pacman ────────────────────────────────────────────────────────────────────
const Pac={
  col:10,row:15,
  dx:0,dy:0,ndx:0,ndy:0,
  sub:0,SPEED:0.13,
  mouth:0.25,mDir:-1,

  reset(col,row){
    this.col=col;this.row=row
    this.dx=0;this.dy=0;this.ndx=-1;this.ndy=0
    this.sub=0
  },

  canEnter(r,c){
    if(r<0||r>=ROWS)return false
    if(c<0||c>=COLS)return true // tunnel wrap
    const v=G.map[r][c]
    return v!==1&&v!==4 // Pacman cannot enter walls or ghost house
  },

  update(){
    this.sub+=this.SPEED
    if(this.sub<1)return
    this.sub=0

    // try queued direction first
    const tnc=this.col+this.ndx,tnr=this.row+this.ndy
    if(this.canEnter(tnr,tnc)){this.dx=this.ndx;this.dy=this.ndy}

    let nc=this.col+this.dx,nr=this.row+this.dy
    if(nc<0)nc=COLS-1;if(nc>=COLS)nc=0
    if(this.canEnter(nr,nc)){this.col=nc;this.row=nr}

    // eat pellet
    const cell=G.map[this.row][this.col]
    if(cell===2){
      G.map[this.row][this.col]=0;G.score+=10;G.pellets--
      Sfx.eat()
      if(G.pellets<=0)onLevelDone()
    }else if(cell===3){
      G.map[this.row][this.col]=0;G.score+=50;G.pellets--
      Sfx.power()
      if(!G.cfg.boss)Ghosts.frighten()
      if(G.pellets<=0)onLevelDone()
    }

    // fruit
    if(Fruit.visible&&this.col===Fruit.col&&this.row===Fruit.row){
      G.score+=200;Fruit.visible=false;Fruit.eaten=true
      Sfx.eatGhost()
    }
  },

  draw(){
    const px=this.col*TILE+TILE/2,py=this.row*TILE+TILE/2,r=TILE/2-1
    let angle=0
    if(this.dx===1)angle=0
    else if(this.dx===-1)angle=Math.PI
    else if(this.dy===-1)angle=-Math.PI/2
    else if(this.dy===1)angle=Math.PI/2

    const m=this.mouth*Math.PI
    ctx.fillStyle='#FFD700'
    ctx.beginPath();ctx.moveTo(px,py)
    ctx.arc(px,py,r,angle+m,angle+Math.PI*2-m)
    ctx.closePath();ctx.fill()

    // eye
    const ex=px+Math.cos(angle-Math.PI/2)*4,ey=py+Math.sin(angle-Math.PI/2)*4
    ctx.fillStyle='#000'
    ctx.beginPath();ctx.arc(ex,ey,1.5,0,Math.PI*2);ctx.fill()

    this.mouth+=0.05*this.mDir
    if(this.mouth>=0.45||this.mouth<=0.02)this.mDir*=-1
  },
}

// ── Ghosts ────────────────────────────────────────────────────────────────────
// states: 'pen' | 'exiting' | 'scatter' | 'chase' | 'frightened' | 'dead'
const GCOLORS=['#FF0000','#FFB8FF','#00FFFF','#FFB852','#FF69B4','#90EE90']

// Staggered release delays (frames at 60fps)
const RELEASE_DELAYS=[0,120,240,360,480,600]

function mkGhost(color,col,row,releaseDelay){
  return {
    color,
    // home pen position
    hCol:col,hRow:row,
    col,row,
    dx:0,dy:1, // start moving down inside pen
    sub:0,
    state:'pen',
    releaseTimer:releaseDelay,
    frighTimer:0,
    SPEED:0.09,
    // exiting pathfinding
    exitPhase:0, // 0=move to center col, 1=move up to exit row
  }
}

const Ghosts={
  list:[],
  exitCol:10,exitRow:7,

  init(cfg,meta){
    this.list=[]
    this.exitCol=meta.exitCol
    this.exitRow=meta.exitRow
    const penSpawns=this._penSpawns()
    const count=Math.min(cfg.ghosts,6)
    for(let i=0;i<count;i++){
      const [sc,sr]=penSpawns[i]||penSpawns[0]
      const g=mkGhost(GCOLORS[i],sc,sr,RELEASE_DELAYS[i])
      g.SPEED=0.09*cfg.speed
      this.list.push(g)
    }
  },

  _penSpawns(){
    return [[10,9],[9,9],[11,9],[9,10],[11,10],[10,10]]
  },

  frighten(){
    this.list.forEach(g=>{
      if(g.state==='chase'||g.state==='scatter'){
        g.state='frightened';g.frighTimer=300
      }
    })
  },

  scatter(){
    this.list.forEach(g=>{
      if(g.state!=='pen'&&g.state!=='exiting'){
        g.state='scatter'
      }
    })
  },

  update(){this.list.forEach(g=>this._updateOne(g))},

  _updateOne(g){
    // Release timer
    if(g.state==='pen'){
      g.releaseTimer--
      // bounce up/down inside pen
      g.sub+=g.SPEED
      if(g.sub>=1){
        g.sub=0
        const nr=g.row+g.dy
        const cell=G.map[nr]?.[g.col]
        if(cell===4){g.row=nr}
        else{g.dy*=-1}
      }
      if(g.releaseTimer<=0){g.state='exiting';g.exitPhase=0}
      return
    }

    if(g.state==='exiting'){
      g.sub+=g.SPEED*1.2
      if(g.sub<1)return
      g.sub=0
      // Phase 0: move horizontally toward exitCol
      if(g.exitPhase===0){
        if(g.col===this.exitCol){g.exitPhase=1}
        else{g.col+=g.col<this.exitCol?1:-1}
      }else{
        // Phase 1: move up toward exitRow
        if(g.row<=this.exitRow){g.state='scatter';g.dx=1;g.dy=0}
        else{g.row--}
      }
      return
    }

    if(g.state==='frightened'){
      g.frighTimer--
      if(g.frighTimer<=0)g.state='chase'
    }

    g.sub+=g.state==='dead'?g.SPEED*1.8:g.SPEED
    if(g.sub<1)return
    g.sub=0

    const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}]
    const canPass=(r,c)=>{
      if(r<0||r>=ROWS)return false
      if(c<0||c>=COLS)return true
      const cell=G.map[r][c]
      if(cell===1)return false
      if(cell===4)return g.state==='dead' // only dead ghosts re-enter pen
      return true
    }

    const candidates=dirs.filter(d=>{
      if(d.dx===-g.dx&&d.dy===-g.dy)return false // no U-turn unless only option
      return canPass(g.row+d.dy,g.col+d.dx)
    })

    // If blocked, allow U-turn
    const opts=candidates.length>0?candidates:dirs.filter(d=>canPass(g.row+d.dy,g.col+d.dx))
    if(opts.length===0)return

    let chosen
    if(g.state==='frightened'){
      chosen=opts[Math.floor(Math.random()*opts.length)]
    }else if(g.state==='dead'){
      const tx=this.exitCol,ty=this.exitRow+1
      chosen=opts.reduce((b,d)=>{
        const nc=g.col+d.dx,nr=g.row+d.dy
        return Math.hypot(nc-tx,nr-ty)<Math.hypot(g.col+b.dx-tx,g.row+b.dy-ty)?d:b
      })
      // Revive when reaching pen entrance
      if(g.col===this.exitCol&&g.row===this.exitRow+1){
        g.state='pen';g.releaseTimer=60;g.sub=0;return
      }
    }else{
      // Chase Pacman
      chosen=opts.reduce((b,d)=>{
        const nc=g.col+d.dx,nr=g.row+d.dy
        return Math.hypot(nc-Pac.col,nr-Pac.row)<Math.hypot(g.col+b.dx-Pac.col,g.row+b.dy-Pac.row)?d:b
      })
    }

    g.dx=chosen.dx;g.dy=chosen.dy
    let nc=g.col+g.dx,nr=g.row+g.dy
    if(nc<0)nc=COLS-1;if(nc>=COLS)nc=0
    g.col=nc;g.row=nr
  },

  checkHit(){
    for(const g of this.list){
      if(g.col===Pac.col&&g.row===Pac.row){
        if(g.state==='frightened'){
          g.state='dead';G.score+=200;Sfx.eatGhost()
        }else if(g.state!=='dead'&&g.state!=='pen'&&g.state!=='exiting'){
          return true
        }
      }
    }
    return false
  },

  drawOne(g){
    if(g.state==='pen'||g.state==='exiting'){
      // draw small while in pen/exiting
      this._drawGhost(g,g.color,0.7)
      return
    }
    let color=g.color
    if(g.state==='frightened'){
      const flash=g.frighTimer<80&&Math.floor(g.frighTimer/8)%2===0
      color=flash?'#fff':'#0000CC'
    }
    if(g.state==='dead'){this._drawEyes(g);return}
    this._drawGhost(g,color,1)
  },

  _drawGhost(g,color,scale){
    const px=g.col*TILE+TILE/2,py=g.row*TILE+TILE/2
    const r=(TILE/2-1)*scale
    ctx.fillStyle=color
    ctx.beginPath()
    ctx.arc(px,py-2*scale,r,Math.PI,0)
    // wavy bottom
    const bot=py+r*0.6
    ctx.lineTo(px+r,bot)
    const segs=3,sw=r*2/segs
    for(let i=0;i<segs;i++){
      const x1=px+r-i*sw-sw/2,x2=px+r-(i+1)*sw
      ctx.quadraticCurveTo(x1,bot-4*scale,x1-sw/2,bot)
      ctx.quadraticCurveTo(x2+sw/2,bot+4*scale,x2,bot)
    }
    ctx.closePath();ctx.fill()
    // eyes
    if(g.state!=='frightened'){
      ctx.fillStyle='#fff'
      ctx.beginPath();ctx.arc(px-3*scale,py-3*scale,2.5*scale,0,Math.PI*2);ctx.fill()
      ctx.beginPath();ctx.arc(px+3*scale,py-3*scale,2.5*scale,0,Math.PI*2);ctx.fill()
      ctx.fillStyle='#00f'
      ctx.beginPath();ctx.arc(px-2*scale+g.dx,py-3*scale+g.dy,1.2*scale,0,Math.PI*2);ctx.fill()
      ctx.beginPath();ctx.arc(px+4*scale+g.dx,py-3*scale+g.dy,1.2*scale,0,Math.PI*2);ctx.fill()
    }else{
      // scared face
      ctx.fillStyle='#fff'
      ctx.beginPath();ctx.arc(px-4,py-2,2,0,Math.PI*2);ctx.fill()
      ctx.beginPath();ctx.arc(px+4,py-2,2,0,Math.PI*2);ctx.fill()
    }
  },

  _drawEyes(g){
    const px=g.col*TILE+TILE/2,py=g.row*TILE+TILE/2
    ctx.fillStyle='#fff'
    ctx.beginPath();ctx.arc(px-4,py-3,3,0,Math.PI*2);ctx.fill()
    ctx.beginPath();ctx.arc(px+4,py-3,3,0,Math.PI*2);ctx.fill()
    ctx.fillStyle='#00f'
    ctx.beginPath();ctx.arc(px-3,py-3,1.5,0,Math.PI*2);ctx.fill()
    ctx.beginPath();ctx.arc(px+5,py-3,1.5,0,Math.PI*2);ctx.fill()
  },

  draw(){this.list.forEach(g=>this.drawOne(g))},
}

// ── Fruit ─────────────────────────────────────────────────────────────────────
const Fruit={
  col:10,row:10,
  active:false,eaten:false,visible:false,timer:0,

  reset(active){
    this.active=active;this.eaten=false;this.visible=false;this.timer=0
  },

  update(){
    if(!this.active||this.eaten)return
    this.timer++
    if(!this.visible&&this.timer===200)this.visible=true
    if(this.visible&&this.timer===500)this.visible=false
  },

  draw(){
    if(!this.visible)return
    const px=this.col*TILE+TILE/2,py=this.row*TILE+TILE/2
    ctx.font=`${TILE-4}px serif`
    ctx.textAlign='center';ctx.textBaseline='middle'
    ctx.fillText('🍒',px,py)
  },
}

// ── Draw maze ─────────────────────────────────────────────────────────────────
function drawMaze(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const v=G.map[r][c],x=c*TILE,y=r*TILE
      if(v===1){
        ctx.fillStyle=G.wallColor||'#1a1aee'
        ctx.fillRect(x,y,TILE,TILE)
        ctx.strokeStyle='rgba(255,255,255,0.08)'
        ctx.lineWidth=1
        ctx.strokeRect(x+1,y+1,TILE-2,TILE-2)
      }else if(v===0||v===4){
        ctx.fillStyle='#000'
        ctx.fillRect(x,y,TILE,TILE)
      }else if(v===2){
        ctx.fillStyle='#000';ctx.fillRect(x,y,TILE,TILE)
        ctx.fillStyle='#FFD700'
        ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2,2,0,Math.PI*2);ctx.fill()
      }else if(v===3){
        ctx.fillStyle='#000';ctx.fillRect(x,y,TILE,TILE)
        // pulsing power pellet
        const pulse=0.8+0.2*Math.sin(G.frame*0.15)
        ctx.fillStyle='#fff'
        ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2,5*pulse,0,Math.PI*2);ctx.fill()
      }
    }
  }
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('hud-lv').textContent=G.level
  document.getElementById('hud-sc').textContent=G.score
  const wEl=document.getElementById('hud-world')
  if(wEl){wEl.textContent=worldName(G.level);wEl.style.color=G.wallColor||'#aaa'}
  const el=document.getElementById('lives-wrap')
  el.innerHTML=''
  for(let i=0;i<G.lives;i++){
    const s=document.createElement('canvas')
    s.width=14;s.height=14;s.style.display='inline-block'
    const c=s.getContext('2d')
    c.fillStyle='#FFD700'
    c.beginPath();c.moveTo(7,7);c.arc(7,7,6,0.3,Math.PI*2-0.3);c.closePath();c.fill()
    el.appendChild(s)
  }
}

// ── Overlay helpers ───────────────────────────────────────────────────────────
function showOver(title,sub,hasNext){
  const o=document.getElementById('overlay')
  o.innerHTML=`
    <h1>${title}</h1>
    <p>${sub}</p>
    ${hasNext
      ?'<button class="btn" onclick="doNext()">NEXT LEVEL ▶</button>'
      :'<button class="btn" onclick="doRestart()">PLAY AGAIN</button>'
    }
  `
  o.style.display='flex'
}

function showDead(){
  const o=document.getElementById('overlay')
  o.innerHTML=`
    <h1>💀 CAUGHT!</h1>
    <p>Lives remaining: ${G.lives}<br>Continue costs 2 coins</p>
    <button class="btn" onclick="doContinueLocal()">CONTINUE</button>
    <button class="btn btn-dark" onclick="doRestart()">QUIT</button>
  `
  o.style.display='flex'
}

function hideOver(){document.getElementById('overlay').style.display='none'}

// ── Game events ───────────────────────────────────────────────────────────────
const WORLD_NAMES=['','BLUE ZONE','PURPLE ZONE','RED ZONE','GREEN ZONE','GOLD ZONE']
function worldName(l){return WORLD_NAMES[Math.floor((l-1)/4)+1]||'INFERNO'}

function onLevelDone(){
  cancelAnimationFrame(G.raf);G.state='won'
  const elapsed=Math.floor((Date.now()-G.startTime)/1000)
  PM.levelComplete(G.level,G.score,elapsed)
  Sfx.win()
  if(G.level>=MAX_LVL){Save.clear();showOver('🎉 YOU WIN!',`Final Score: ${G.score}`,false);return}
  // Save progress for next level
  const nextLvl=G.level+1
  Save.set(nextLvl,G.score,G.lives)
  const world=worldName(nextLvl)
  const boss=LCFG[Math.min(nextLvl,MAX_LVL)]?.boss?' ⚠️ NO POWER PELLETS':''
  showOver(`LEVEL ${G.level} CLEAR! ✨`,
    `Score: ${G.score}  ·  Lives: ${G.lives}\nNext: Level ${nextLvl} — ${world}${boss}`,true)
}

function onPacDead(){
  cancelAnimationFrame(G.raf);G.lives--
  Sfx.death();updateHUD()
  if(G.lives<=0){
    G.state='gameover';PM.gameOver(G.level,G.score)
    Save.clear() // no progress to keep — game over
    showOver('GAME OVER',`Score: ${G.score}`,false)
  }else{
    G.state='dead'
    Save.set(G.level,G.score,G.lives) // save remaining lives
    PM.requestContinue()
    showDead()
  }
}

function doContinueLocal(){hideOver();G.doContinue()}
function doNext(){hideOver();G.init(G.level+1);updateHUD()}
function doRestart(){hideOver();Save.clear();G.score=0;G.lives=3;launchLevel(1)}
function launchLevel(l,score=0,lives=3){G.score=score;G.lives=lives;G.init(l);updateHUD()}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop(){
  if(G.state!=='playing')return
  G.frame++

  Pac.update()
  Ghosts.update()
  Fruit.update()

  ctx.clearRect(0,0,CW,CH)
  drawMaze()
  Fruit.draw()
  Ghosts.draw()
  Pac.draw()

  if(Ghosts.checkHit()){onPacDead();return}

  updateHUD()
  G.raf=requestAnimationFrame(loop)
}

// ── Input ─────────────────────────────────────────────────────────────────────
const KEY={
  ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],
  a:[-1,0],d:[1,0],w:[0,-1],s:[0,1],
  A:[-1,0],D:[1,0],W:[0,-1],S:[0,1],
}
window.addEventListener('keydown',e=>{
  const d=KEY[e.key];if(!d)return;e.preventDefault()
  Pac.ndx=d[0];Pac.ndy=d[1]
})
let tx=0,ty=0
window.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true})
window.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty
  if(Math.abs(dx)>Math.abs(dy)){Pac.ndx=dx>0?1:-1;Pac.ndy=0}
  else{Pac.ndx=0;Pac.ndy=dy>0?1:-1}
})

// ── Start screen ──────────────────────────────────────────────────────────────
function buildStartScreen(){
  const o=document.getElementById('overlay')
  const saved=Save.get()
  let html=`<h1>👾 PACMAN</h1><p>Arrow keys / WASD to move<br>Eat all pellets · Power pellets stun ghosts!</p>`
  if(saved&&saved.level>1){
    const w=worldName(saved.level)
    html+=`<button class="btn" id="btn-continue">▶ CONTINUE  LVL ${saved.level} — ${w}</button>`
    html+=`<small style="color:#666;font-size:9px">Score: ${saved.score}  ·  Lives: ${saved.lives}</small>`
    html+=`<button class="btn btn-dark" id="btn-new">New Game</button>`
  }else{
    html+=`<button class="btn" id="btn-start">▶ PLAY</button>`
  }
  o.innerHTML=html

  document.getElementById('btn-start')?.addEventListener('click',()=>{
    PM.start(1);hideOver();Save.clear()
    launchLevel(1)
  })
  document.getElementById('btn-continue')?.addEventListener('click',()=>{
    PM.start(saved.level);hideOver()
    launchLevel(saved.level,saved.score,saved.lives)
  })
  document.getElementById('btn-new')?.addEventListener('click',()=>{
    PM.start(1);hideOver();Save.clear()
    launchLevel(1)
  })
}
buildStartScreen()
</script>
