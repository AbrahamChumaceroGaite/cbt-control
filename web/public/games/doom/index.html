<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOOM</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #dos { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="dos"></div>
  <script>
    // Wrapped in IIFE to avoid any variable conflicts with js-dos internals.
    // autoSave: true persists the DOS filesystem to IndexedDB — saves survive browser sessions.
    (function () {
      var emulator = Dos(document.getElementById('dos'), {
        url:              'https://cdn.dos.zone/custom/dos/doom.jsdos',
        autoStart:        true,
        autoSave:         true,
        mouseCapture:     true,
        mouseSensitivity: 0.4,
        theme:            'dark',
      });

      emulator.events().onMessage = function (type) {
        if (type === 'ci-ready') {
          window.parent.postMessage({ type: 'SESSION_START' }, '*');
        }
      };
    })();
  </script>
</body>
</html>
