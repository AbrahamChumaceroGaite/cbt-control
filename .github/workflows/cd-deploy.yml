name: CD — Deploy to Production

on:
  push:
    branches: [deploy]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  notify:
    name: Deploy — production server
    runs-on: ubuntu-latest
    steps:
      - name: Deployment handled by Coolify
        run: echo "Push to deploy received — Coolify webhook triggers the production redeploy automatically."
