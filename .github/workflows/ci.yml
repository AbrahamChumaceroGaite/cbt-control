name: CI — Typecheck, Test, Build, Lint

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  # ── Shared types ─────────────────────────────────────────────────────────────
  shared:
    name: Build shared types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w shared

  # ── API (NestJS) ──────────────────────────────────────────────────────────────
  api:
    name: API — typecheck · test · build
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # nest build uses tsconfig.build.json which excludes spec files
      # and performs full TypeScript typecheck as part of compilation
      - name: API — tests
        run: node_modules/.bin/vitest run --config api/vitest.config.ts

      - name: API — build (includes typecheck via nest build)
        run: npm run build -w api

  # ── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    name: Web — typecheck · test · lint · build
    runs-on: ubuntu-latest
    needs: shared
    env:
      # Next.js build requires these at build time — use placeholder values for CI
      NEXT_PUBLIC_WS_URL: ws://localhost:4001/ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Web — typecheck
        run: npm run typecheck -w web

      - name: Web — tests
        run: cd web && ../node_modules/.bin/vitest run

      - name: Web — lint
        run: npm run lint -w web

      - name: Web — build
        run: npm run build -w web
