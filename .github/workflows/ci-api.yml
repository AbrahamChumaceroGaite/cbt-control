name: CI — API

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [develop]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-api.yml'

jobs:
  api:
    name: API — test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # shared must be compiled first — each job runs on a fresh runner
      # so the output from a separate job would not be available here
      - name: Build shared types
        run: npm run build -w shared

      - name: API — tests
        run: node_modules/.bin/vitest run --config api/vitest.config.ts

      # nest build uses tsconfig.build.json (excludes spec files)
      # and performs full TypeScript typecheck as part of compilation
      - name: API — build (includes typecheck via nest build)
        run: npm run build -w api
