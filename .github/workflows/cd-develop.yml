name: CD — Deploy to DEV

on:
  push:
    branches: [develop]

# Only one deploy at a time — cancel in-flight if new push arrives
concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy DEV
    runs-on: ubuntu-latest
    # Only deploy when CI passes (ci.yml must finish first on the same commit)
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker images
        run: |
          echo "Deploy step — configure per your hosting provider."
          echo "Typical steps:"
          echo "  1. docker build -t ghcr.io/org/cbt-api:dev ./api"
          echo "  2. docker push ghcr.io/org/cbt-api:dev"
          echo "  3. Trigger remote deploy (ssh, webhook, etc.)"
        # Replace the above echo commands with real deploy commands once
        # the hosting infrastructure is configured.
