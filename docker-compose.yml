services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "${API_PORT:-4001}"
    env_file:
      - ./api/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/prod.db}
      - PORT=${API_PORT:-4001}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - TZ=America/La_Paz
      - REDIS_URL=redis://redis:6379
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/uploads
      - logs:/app/logs
      - backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT:-4001}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    expose:
      - "9000"
      - "9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - TZ=America/La_Paz
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  api-games:
    build:
      context: .
      dockerfile: api-games/Dockerfile
    expose:
      - "${GAMES_PORT:-4003}"
    env_file:
      - ./api-games/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${GAMES_DATABASE_URL:-file:/app/data/academic.db}
      - PORT=${GAMES_PORT:-4003}
      - CORE_API_URL=http://api:${API_PORT:-4001}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-cbt-games}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - TZ=America/La_Paz
    volumes:
      - games_data:/app/data
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${GAMES_PORT:-4003}/api/games"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - API_URL=http://api:${API_PORT:-4001}
        - GAMES_API_URL=http://api-games:${GAMES_PORT:-4003}
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:${API_PORT:-4001}
      - GAMES_API_URL=http://api-games:${GAMES_PORT:-4003}
      - TZ=America/La_Paz
    depends_on:
      api:
        condition: service_healthy
      api-games:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT:-7080}:80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      api-games:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  games_data:
  redis_data:
  minio_data:
  uploads:
  logs:
  backups:
